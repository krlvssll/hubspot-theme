name: Backfill press row slugs

on:
  workflow_dispatch: {}

jobs:
  backfill-press-slugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run press slug backfill script
        env:
          HUBSPOT_PAT: ${{ secrets.hubspot_private_app_token }}
          HUBSPOT_PORTAL_ID: ${{ vars.hubspot_account_id || secrets.hubspot_portal_id }}
        run: node scripts/backfill_press_slugs.js
