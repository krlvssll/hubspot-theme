name: Diag page widgets (read-only)

on:
  workflow_dispatch: {}

jobs:
  diag-page-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run diagnostic
        env:
          HUBSPOT_PAT: ${{ secrets.hubspot_private_app_token }}
        run: node scripts/diag_page_widgets.js
