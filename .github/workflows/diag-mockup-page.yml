name: Diag mockup page

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run diag script
        env:
          HUBSPOT_PAT: ${{ secrets.hubspot_private_app_token }}
        run: node scripts/diag_mockup_page.js
