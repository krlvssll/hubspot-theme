name: Deploy Brand Redesign Theme to HubSpot

on:
  workflow_dispatch:
    inputs:
      publish_llms:
        description: "Also publish llms.txt and its site-root proxy"
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HubSpot Deploy Action
        uses: HubSpot/hubspot-cms-deploy-action@v2.0.1
        with:
          src_dir: true-doors-brand-theme
          dest_dir: true-doors-brand-theme
          account_id: ${{ vars.hubspot_account_id || secrets.hubspot_portal_id }}
          personal_access_key: ${{ secrets.hubspot_personal_access_key }}

      - name: Set up Node.js for LLM discovery publishing
        if: inputs.publish_llms
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check discovery publisher
        if: inputs.publish_llms
        run: node --test scripts/publish_llms.test.js

      - name: Upload llms.txt using CMS deployment credentials
        if: inputs.publish_llms
        env:
          HUBSPOT_ACCOUNT_ID: ${{ vars.hubspot_account_id || secrets.hubspot_portal_id }}
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.hubspot_personal_access_key }}
        run: npx --yes --package=@hubspot/cli@^7 --call='hs filemanager upload llms.txt true-doors-brand/llms.txt --use-env'

      - name: Publish llms.txt and root proxy
        if: inputs.publish_llms
        env:
          HUBSPOT_PAT: ${{ secrets.hubspot_private_app_token }}
        run: node scripts/publish_llms.js
